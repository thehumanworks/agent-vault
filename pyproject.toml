[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agent-vault"
dynamic = ["version"]
description = "Run coding agents with their login files synced across machines through a vault secret"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
avlt = "agent_vault.cli:main"
agent-vault = "agent_vault.cli:main"

[tool.hatch.version]
path = "src/agent_vault/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_vault", "conftest", "fake_doppler"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agent_vault"]
