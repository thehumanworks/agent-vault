\* Expected to FAIL: with a base per run, a run that starts while another run's program has just changed a key replaces it with the vault's copy.
CONSTANTS
    m1 = m1
    m2 = m2
    r1 = r1
    r2 = r2
    r3 = r3
    Machines = {m1, m2}
    Runs = {r1, r2, r3}
    Host <- MCHost
    Timed = {"a"}
    Untimed = {"k"}
    MaxValue = 5
    MaxFaults = 1
    MaxAttempts = 2
    Guarded = TRUE
    SharedBase = FALSE
    Rebase = TRUE
    Ephemeral = TRUE
    AllowLogout = FALSE
    AllowHandEdit = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostLocalChange
SYMMETRY MCSymmetry
