\* agent-vault: every property holds.
CONSTANTS
    m1 = m1
    m2 = m2
    r1 = r1
    r2 = r2
    r3 = r3
    Machines = {m1, m2}
    Runs = {r1, r2, r3}
    Host <- MCHost
    Timed = {"a"}
    Untimed = {"k"}
    MaxValue = 6
    MaxFaults = 1
    MaxAttempts = 2
    Guarded = TRUE
    SharedBase = TRUE
    Rebase = TRUE
    Ephemeral = TRUE
    AllowLogout = FALSE
    AllowHandEdit = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLostRefresh NoResurrection SafeRemoval NoLostLocalChange Converged OneSyncPerMachine
SYMMETRY MCSymmetry
